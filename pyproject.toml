[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-automizer"
version = "0.1.0"
description = "MCP server that connects Claude Code to your YouTube channel: analytics, niche research, policy-compliant uploads."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "google-auth>=2.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
yt-automizer = "yt_automizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
